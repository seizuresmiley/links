<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="みのり — ラブライブ！＆メディアミックスDJ。ミックス、エディット、各種リンク。">
  <meta name="theme-color" content="#f5f4f0">
  <title>みのり — リンク</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hasunosoraschoolidol.club/links/">
  <meta property="og:title" content="みのり — リンク">
  <meta property="og:description" content="みのり — ラブライブ！＆メディアミックスDJ。ミックス、エディット、各種リンク。">
  <meta property="og:image" content="https://hasunosoraschoolidol.club/img/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="みのり — リンク">
  <meta name="twitter:description" content="みのり — ラブライブ！＆メディアミックスDJ。ミックス、エディット、各種リンク。">
  <meta name="twitter:image" content="https://hasunosoraschoolidol.club/img/preview.jpg">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f4f0;
      --ink: #202921;
      --muted: #596159;
      --line: #d8ddd4;
      --accent: #355940;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { width: min(100% - 40px, 480px); margin: 0 auto; padding: 56px 0 28px; }
    .language-switch { display: flex; justify-content: flex-end; gap: 4px; margin-bottom: 24px; }
    .language-switch button {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .language-switch button[aria-pressed="true"] {
      border-color: var(--line);
      background: #fff;
      color: var(--ink);
      font-weight: 650;
    }
    header { margin-bottom: 28px; }
    h1 { margin: 0; font-size: 36px; line-height: 1.2; letter-spacing: -1px; font-weight: 750; }
    header p { margin: 8px 0 0; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
    .links { display: grid; gap: 10px; }
    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 70px;
      padding: 14px 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      text-decoration: none;
    }
    .link:hover { border-color: var(--accent); }
    .link strong { display: block; font-size: 17px; font-weight: 650; }
    .link small { display: block; color: var(--muted); font-size: 13px; }
    .arrow { font-size: 22px; color: var(--accent); }
    .listen { margin-top: 36px; }
    h2 { margin: 0 0 16px; font-size: 20px; letter-spacing: -.3px; }
    .player-card { padding: 18px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    .player-card + .player-card { margin-top: 12px; }
    .player-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h3 { margin: 0; font-size: 16px; font-weight: 650; }
    .player-heading a { font-size: 13px; }
    .load-player {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 56px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f4f6f2;
      color: var(--accent);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .load-player:hover { background: #eaf0e6; border-color: var(--accent); }
    iframe { display: block; width: 100%; border: 0; border-radius: 6px; }
    .note { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
    footer { margin-top: 30px; font-size: 13px; }
    @media (max-width: 360px) {
      main { width: calc(100% - 28px); padding-top: 36px; }
      .player-card { padding: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="language-switch" role="group" aria-label="Language / 言語" hidden>
      <button type="button" lang="ja" data-lang="ja" aria-pressed="true">日本語</button>
      <button type="button" lang="en" data-lang="en" aria-pressed="false">English</button>
    </div>
    <header>
      <h1>みのり</h1>
      <p data-i18n="description">ラブライブ！＆メディアミックスDJ。</p>
    </header>

    <nav class="links" aria-label="各種リンク" data-i18n-label="linksLabel">
      <a class="link" href="https://soundcloud.com/seirent">
        <span><strong>SoundCloud</strong><small data-i18n="tracks">トラック＆エディット</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.mixcloud.com/seirent/">
        <span><strong>Mixcloud</strong><small data-i18n="djMixes">DJミックス</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://x.com/seirent_127">
        <span><strong>X / Twitter</strong><small>@seirent_127</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <section class="listen" aria-labelledby="listen-heading">
      <h2 id="listen-heading" data-i18n="listen">聴く</h2>

      <article class="player-card">
        <div class="player-heading">
          <h3 data-i18n="mixes">ミックス</h3>
          <a href="https://www.mixcloud.com/seirent/" data-i18n="onMixcloud">Mixcloudで聴く ↗</a>
        </div>
        <div class="player-slot">
          <button class="load-player" type="button" data-player="mixcloud">
            <span aria-hidden="true">▶</span> <span data-i18n="loadMixcloud">Mixcloudプレーヤーを読み込む</span>
          </button>
        </div>
      </article>

      <article class="player-card">
        <div class="player-heading">
          <h3 data-i18n="tracks">トラック＆エディット</h3>
          <a href="https://soundcloud.com/seirent" data-i18n="onSoundcloud">SoundCloudで聴く ↗</a>
        </div>
        <div class="player-slot">
          <button class="load-player" type="button" data-player="soundcloud">
            <span aria-hidden="true">▶</span> <span data-i18n="loadSoundcloud">SoundCloudプレーヤーを読み込む</span>
          </button>
        </div>
      </article>
      <p class="note" data-i18n="playerNote">タップするとプレーヤーを読み込みます。自動再生はしません。</p>
      <noscript><p class="note">上のリンクからSoundCloud・Mixcloudで聴けます。</p></noscript>
    </section>

    <footer><a href="https://hasunosoraschoolidol.club/" data-i18n="mainSite">← メインサイト</a></footer>
  </main>

  <script>
    const translations = {
      ja: {
        title: 'みのり — リンク',
        description: 'ラブライブ！＆メディアミックスDJ。',
        metaDescription: 'みのり — ラブライブ！＆メディアミックスDJ。ミックス、エディット、各種リンク。',
        linksLabel: '各種リンク',
        tracks: 'トラック＆エディット',
        djMixes: 'DJミックス',
        listen: '聴く',
        mixes: 'ミックス',
        onMixcloud: 'Mixcloudで聴く ↗',
        onSoundcloud: 'SoundCloudで聴く ↗',
        loadMixcloud: 'Mixcloudプレーヤーを読み込む',
        loadSoundcloud: 'SoundCloudプレーヤーを読み込む',
        playerNote: 'タップするとプレーヤーを読み込みます。自動再生はしません。',
        mainSite: '← メインサイト',
        mixcloudTitle: 'みのりのDJミックス（Mixcloud）',
        soundcloudTitle: 'みのりのトラック＆エディット（SoundCloud）'
      },
      en: {
        title: 'みのり — links',
        description: 'Love Live and mixed media DJ.',
        metaDescription: 'みのり — Love Live and mixed media DJ. Mixes, edits, and links.',
        linksLabel: 'Find me online',
        tracks: 'Tracks & edits',
        djMixes: 'DJ mixes',
        listen: 'Listen',
        mixes: 'Mixes',
        onMixcloud: 'On Mixcloud ↗',
        onSoundcloud: 'On SoundCloud ↗',
        loadMixcloud: 'Load Mixcloud player',
        loadSoundcloud: 'Load SoundCloud player',
        playerNote: 'Players load when tapped. No autoplay.',
        mainSite: '← Main site',
        mixcloudTitle: 'DJ mixes by みのり on Mixcloud',
        soundcloudTitle: 'Tracks and edits by みのり on SoundCloud'
      }
    };

    function setLanguage(language) {
      const text = translations[language];
      document.documentElement.lang = language;
      document.title = text.title;
      document.querySelector('meta[name="description"]').content = text.metaDescription;
      document.querySelectorAll('[data-i18n]').forEach(element => {
        element.textContent = text[element.dataset.i18n];
      });
      document.querySelectorAll('[data-i18n-label]').forEach(element => {
        element.setAttribute('aria-label', text[element.dataset.i18nLabel]);
      });
      document.querySelectorAll('[data-lang]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === language));
      });
      document.querySelectorAll('iframe[data-provider]').forEach(frame => {
        frame.title = text[frame.dataset.provider + 'Title'];
      });
    }

    let savedLanguage;
    try { savedLanguage = localStorage.getItem('links-language'); } catch {}
    setLanguage(['ja', 'en'].includes(savedLanguage) ? savedLanguage : (navigator.language.startsWith('ja') ? 'ja' : 'en'));
    document.querySelector('.language-switch').hidden = false;
    document.querySelectorAll('[data-lang]').forEach(button => {
      button.addEventListener('click', () => {
        setLanguage(button.dataset.lang);
        try { localStorage.setItem('links-language', button.dataset.lang); } catch {}
      });
    });

    // Profile feeds update when new music is uploaded; no API key or build needed.
    const players = {
      mixcloud: {
        src: 'https://www.mixcloud.com/widget/iframe/?hide_cover=1&feed=%2Fseirent%2F',
        height: 300
      },
      soundcloud: {
        src: 'https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Fusers%2F32535567&color=%23355940&auto_play=false&show_artwork=true&show_comments=false&visual=false',
        height: 300
      }
    };
    document.querySelectorAll('[data-player]').forEach(button => {
      button.addEventListener('click', () => {
        const player = players[button.dataset.player];
        const frame = document.createElement('iframe');
        frame.src = player.src;
        frame.dataset.provider = button.dataset.player;
        frame.title = translations[document.documentElement.lang][button.dataset.player + 'Title'];
        frame.height = String(player.height);
        frame.allow = 'autoplay; encrypted-media';
        button.replaceWith(frame);
        frame.focus();
      }, { once: true });
    });
  </script>
</body>
</html>
