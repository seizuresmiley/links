<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DJ mixes, edits, and links from seirent.">
  <meta name="theme-color" content="#f5f4f0">
  <title>seirent — links</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f4f0;
      --ink: #202921;
      --muted: #596159;
      --line: #d8ddd4;
      --accent: #355940;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { width: min(100% - 40px, 480px); margin: 0 auto; padding: 56px 0 28px; }
    header { margin-bottom: 28px; }
    h1 { margin: 0; font-size: 36px; line-height: 1.2; letter-spacing: -1px; font-weight: 750; }
    header p { margin: 8px 0 0; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
    .links { display: grid; gap: 10px; }
    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 70px;
      padding: 14px 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      text-decoration: none;
    }
    .link:hover { border-color: var(--accent); }
    .link strong { display: block; font-size: 17px; font-weight: 650; }
    .link small { display: block; color: var(--muted); font-size: 13px; }
    .arrow { font-size: 22px; color: var(--accent); }
    .listen { margin-top: 36px; }
    h2 { margin: 0 0 16px; font-size: 20px; letter-spacing: -.3px; }
    .player-card { padding: 18px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    .player-card + .player-card { margin-top: 12px; }
    .player-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h3 { margin: 0; font-size: 16px; font-weight: 650; }
    .player-heading a { font-size: 13px; }
    .load-player {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 56px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f4f6f2;
      color: var(--accent);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .load-player:hover { background: #eaf0e6; border-color: var(--accent); }
    iframe { display: block; width: 100%; border: 0; border-radius: 6px; }
    .note { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
    footer { margin-top: 30px; font-size: 13px; }
    @media (max-width: 360px) {
      main { width: calc(100% - 28px); padding-top: 36px; }
      .player-card { padding: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>seirent</h1>
      <p>DJ mixes &amp; edits.</p>
    </header>

    <nav class="links" aria-label="Find me online">
      <a class="link" href="https://soundcloud.com/seirent">
        <span><strong>SoundCloud</strong><small>Tracks &amp; edits</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.mixcloud.com/seirent/">
        <span><strong>Mixcloud</strong><small>DJ mixes</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://x.com/seirent_127">
        <span><strong>X / Twitter</strong><small>@seirent_127</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <section class="listen" aria-labelledby="listen-heading">
      <h2 id="listen-heading">Listen</h2>

      <article class="player-card">
        <div class="player-heading">
          <h3>Mixes</h3>
          <a href="https://www.mixcloud.com/seirent/">On Mixcloud ↗</a>
        </div>
        <div class="player-slot">
          <button class="load-player" type="button" data-player="mixcloud">
            <span aria-hidden="true">▶</span> Load Mixcloud player
          </button>
        </div>
      </article>

      <article class="player-card">
        <div class="player-heading">
          <h3>Tracks &amp; edits</h3>
          <a href="https://soundcloud.com/seirent">On SoundCloud ↗</a>
        </div>
        <div class="player-slot">
          <button class="load-player" type="button" data-player="soundcloud">
            <span aria-hidden="true">▶</span> Load SoundCloud player
          </button>
        </div>
      </article>
      <p class="note">Players load when tapped. No autoplay.</p>
      <noscript><p class="note">Listen using the SoundCloud and Mixcloud links above.</p></noscript>
    </section>

    <footer><a href="https://hasunosoraschoolidol.club/">← Main site</a></footer>
  </main>

  <script>
    // Profile feeds update when new music is uploaded; no API key or build needed.
    const players = {
      mixcloud: {
        src: 'https://www.mixcloud.com/widget/iframe/?hide_cover=1&feed=%2Fseirent%2F',
        title: 'DJ mixes by seirent on Mixcloud',
        height: 300
      },
      soundcloud: {
        src: 'https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Fusers%2F32535567&color=%23355940&auto_play=false&show_artwork=true&show_comments=false&visual=false',
        title: 'Tracks and edits by seirent on SoundCloud',
        height: 300
      }
    };
    document.querySelectorAll('[data-player]').forEach(button => {
      button.addEventListener('click', () => {
        const player = players[button.dataset.player];
        const frame = document.createElement('iframe');
        frame.src = player.src;
        frame.title = player.title;
        frame.height = String(player.height);
        frame.allow = 'autoplay; encrypted-media';
        button.replaceWith(frame);
        frame.focus();
      }, { once: true });
    });
  </script>
</body>
</html>
